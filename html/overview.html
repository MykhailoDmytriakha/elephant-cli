    return '<details class="band ' + state + '" data-key="band.' + ph + '"' +
           (isOpen("band." + ph, true) ? " open" : "") + '><summary class="band-h">' +
           '<span class="bn">' + (i + 1) + "</span><span class=\"bname\">" + esc(ph) + "</span>" +
           '<span class="btitle">' + RU[ph] + " — " + TITLE[ph] + "</span><span class=\"bmark\">" + mark + "</span>" +
           "</summary>" + (inner || '<div class="band-empty">пока ничего</div>') + "</details>";
  }

  /* 1 · КОНТЕКСТ — вопросы, рамка, ИФР, задача, свёртка, незнание, файлы сбора. */
  var c = "";
  var rounds = d.qa || [];
  var nPairs = rounds.reduce(function (a, r) { return a + r.pairs.length; }, 0);
  if (nPairs) {
    var qh = "";
    rounds.forEach(function (r) {
      if (rounds.length > 1)
        qh += '<div class="crit-node">Раунд ' + r.round + "</div>";
      r.pairs.forEach(function (p) {
        qh += '<div class="qa"><div class="q">' + inl(p.q) +
              (p.area ? '<span class="area">' + esc(p.area) + "</span>" : "") +
              (p.assumed ? '<span class="area loan" title="' + esc(p.assumed) + '">займ слова — предположено агентом</span>' : "") + "</div>" +
              (p.a ? '<div class="a">' + md(p.a) + "</div>"
                   : '<div class="a blank">ответа пока нет</div>') +
              (p.assumed ? '<div class="a blank">почему так принял: ' + esc(p.assumed) + "</div>" : "") + "</div>";
      });
    });
    c += sec("ctx.qa", term("qa", "вопросы и ответы") + ' <span class="n">' + nPairs + "</span>",
             '<div class="plain">' + qh + "</div>", false);
  }
  /* SCOPE — РАМКА: 5W+1H плюс части рамки, каждая своей складной карточкой. */
  var sc = d.scope;
  var fr = d.frame || {};
  var FRAME = [["requirements", term("requirements", "требования")],
               ["constraints", term("constraints", "ограничения снаружи")],
               ["limitations", term("limitations", "пределы")],
               ["resources", term("resources", "ресурсы")],
               ["finance", term("finance", "финансы")],
               ["tools", term("tools", "инструменты")],
               ["definitions", term("definitions", "определения")],
               ["beyond", term("beyond", "за рамкой — близко, но не делаем")]];
  var dimsHtml = "";
  if (sc) {
    DIMS.forEach(function (dm) {
      var v = sc[dm[0]];
      var struck = (v && v.struck) || [];
      if (!v || (!v["in"].length && !v.out.length && !v.blur.length && !struck.length)) return;
      dimsHtml += "<b>" + dm[1] + "</b><ul>";
      v["in"].forEach(function (x) { dimsHtml += "<li>" + inl(x) + "</li>"; });
      v.out.forEach(function (x) { dimsHtml += '<li class="out">' + inl(x) + "</li>"; });
      v.blur.forEach(function (x) { dimsHtml += '<li class="blur">' + inl(x) + "</li>"; });
      struck.forEach(function (x) {
        dimsHtml += '<li class="struck">' + inl(x.replace(/~~/g, "")) + "</li>";
      });
      dimsHtml += "</ul>";
    });
    var notes = d.scope_notes || [];
    if (notes.length) {
      dimsHtml += '<div class="amend-notes">' + notes.map(function (n) {
        return "⟲ п" + esc(n.n) + " · " + esc(n.ts) + " · " + esc(RU[n.phase] || n.phase) +
               " · " + esc(n.why) + (n.refs && n.refs !== "—" ? " · основание: " + esc(n.refs) : "");
      }).join("<br>") + "</div>";
    }
  }
  var hasFrame = FRAME.some(function (f) { return hasDoc(fr[f[0]]); });
  if (dimsHtml || hasFrame) {
    var sh = "";
    if (dimsHtml) {
      sh += box("ctx.scope.5w", "5W+1H — границы: что входит, что не входит, где размыто",
                '<div class="dim">' + dimsHtml + "</div>", false);
    }
    FRAME.forEach(function (f) {
      if (!hasDoc(fr[f[0]])) return;
      sh += box("ctx.frame." + f[0], f[1], docHtml(fr[f[0]]), false);
    });
    c += sec("ctx.scope", term("scope", "рамка задачи"), sh);
  }
  /* ИФР — ПЯТЬ ЧАСТЕЙ, в порядке накопления: критерии успеха · ожидаемые результаты ·
     метрики · чек-лист приёмки (по нему ходит проверка) · сам идеал — последним. */
  var ip = d.ifr_parts || {};
  var IFRP = [["success", term("success", "критерии успеха — при каких условиях это успех"), true],
              ["outcomes", term("outcomes", "ожидаемые результаты — что будет существовать и наблюдаться"), false],
              ["metrics", term("metrics", "метрики качества — числа с порогами"), false],
              ["checklist", term("checklist", "чек-лист приёмки — что человек проверит руками"), true],
              ["parts", term("parts", "крупные части пути — как ЧЕЛОВЕК видит работу"), true]];
  var hasIfr = hasDoc(d.ifr) || IFRP.some(function (f) { return hasDoc(ip[f[0]]); });
  if (hasIfr) {
    var ih = "";
    IFRP.forEach(function (f) {
      if (!hasDoc(ip[f[0]])) return;
      ih += box("ifr." + f[0], f[1], docHtml(ip[f[0]]), f[2]);
    });
    if (hasDoc(d.ifr)) ih += box("ifr.ideal", term("ifr", "сам идеал — одним абзацем"), docHtml(d.ifr), true);
    c += sec("ctx.ifr", term("IFR", "идеальный финальный результат — глазами пользователя"), ih);
  }
  if (hasDoc(d.clarified)) {
    c += sec("ctx.clarified", term("clarified", "задача после уточнений"), '<div class="plain">' + docHtml(d.clarified) + "</div>");
  }
  if (hasDoc(d.summary)) {
    c += sec("ctx.summary", term("summary", "свёртка контекста"), '<div class="plain">' + docHtml(d.summary) + "</div>");
  }
  if (d.unknown) {
    c += sec("ctx.unknown", term("unknown", "чего я не знаю"), '<div class="plain">' + md(d.unknown) + "</div>");
  }
  var cf = filesBox("context", "Контекст") + filesBox("research", "Исследования");
  if (cf) c += sec("ctx.files", "Файлы сбора", cf);
  h += band("context", c);

  /* 2 · ДУМАТЬ — ЛЕСТНИЦА ТАКТОВ в порядке думания (владелец, 2026-08-21: «в таком порядке
     тактов, как оно идёт, в таком порядке и показываем»). Порядок и названия приходят из
     данных (think_steps) — та же таблица, что ведёт агента. Главное раскрыто — идеалы,
     кристалл, развилки с выбором; остальное свёрнуто; не написанный такт — строкой. */
  var t = "";
  var tsteps = d.think_steps || [];
  var tparts = d.think_parts || {};
  var forks = d.forks || [];
  var OPEN_T = { ideals: 1, crystal: 1, decision: 1 };
  var anyThink = forks.length || hasDoc(d.think_tools) ||
                 tsteps.some(function (s) { return hasDoc(tparts[s[0]]); });
  if (anyThink) {
    var lh = "";
    tsteps.forEach(function (s) {
      var key = s[0], title = s[1], v = tparts[key];
      if (key === "decision" && forks.length) {
        var fh = "";
        forks.forEach(function (f) {
          fh += '<div class="fork"><div class="fq"><span class="nid">' + esc(f.id) + "</span> " +
                inl(f.q) + ' <span class="lvl">решает: ' + esc(f.who) + "</span>" +
                (f.preview ? ' <a class="prev" href="' + encodeURI(f.preview) +
                             '" target="_blank">открыть превью ↗</a>' : "") + "</div>";
          if (f.decide) fh += '<div class="fmeta"><b>решить:</b> ' + inl(f.decide) + "</div>";
          fh += "<ul>";
          var det = f.details || [];
          (f.options || []).forEach(function (o, i) {
            var dd = det[i] || {};
            fh += "<li>" + inl(o) +
                  (dd.model ? '<div class="fsub"><b>модель:</b> ' + inl(dd.model) + "</div>" : "") +
                  (dd.falsifier ? '<div class="fsub"><b>falsifier:</b> ' + inl(dd.falsifier) + "</div>" : "") +
                  "</li>";
          });
          fh += "</ul>";
          if (f.recommendation)
            fh += '<div class="fmeta"><b>рекомендация до выбора:</b> ' + inl(f.recommendation) + "</div>";
          fh += (f.decision ? '<div class="fdec">✓ ' + inl(f.decision) + "</div>"
                            : '<div class="fdec open">— развилка открыта</div>');
          if (f.fixed) fh += '<div class="fmeta fixed"><b>зафиксировано:</b> ' + inl(f.fixed) + "</div>";
          fh += "</div>";
        });
        lh += box("think." + key, term(key, title) + ' <span class="n">' + forks.length + "</span>",
                  fh + (hasDoc(v) && doc(v).amend.length ? amendHtml(doc(v).amend) : ""), true);
      } else if (hasDoc(v)) {
        lh += box("think." + key, term(key, title), docHtml(v), !!OPEN_T[key]);
      } else {
        lh += '<div class="band-empty">· ' + esc(title) + " — ещё нет</div>";
      }
    });
    if (hasDoc(d.think_tools)) {
      lh += box("think.tools", term("tools", "приёмы думания — что брал и что дал каждый"), docHtml(d.think_tools), false);
    }
    t += sec("think.ladder", term("think", "лестница думания"), lh);
  } else if (!tsteps.length && (hasDoc(d.ideals) || hasDoc(d.crystal))) {
    /* a data file written before the ladder existed: fall back to the two old sections */
    if (hasDoc(d.ideals))
      t += sec("think.ideals", term("ideals", "семья идеалов"), '<div class="plain">' + docHtml(d.ideals) + "</div>");
    if (hasDoc(d.crystal))
      t += sec("think.crystal", term("crystal", "как вызревало решение"), '<div class="plain">' + docHtml(d.crystal) + "</div>");
  }
  var tf = filesBox("thinking", "Думание");
  if (tf) t += sec("think.files", "Файлы думания", tf);
  h += band("think", t);

  /* 3 · ПЛАН — сетевой план и складное дерево узлов: этапы, внутри пакеты и задачи; у
     каждого узла его заполненные поля (результат, критерии, артефакты, входы, зависимости,
     остановки). */
  var pl = "";
      /* КОНТРАКТ В ДВЕ КОЛОНКИ. Слева: result · check (чек-лист с вердиктами из d.criteria
         по номеру) · sync — остановка плиткой (парсим «показываю: … увидишь: … потрогать: …
         от тебя: …», если агент так написал; иначе текст как есть). Справа: executor · deps ·
         inputs · resources · artifacts + storage · covers. Прочие поля — внизу справа. */
      var CT_LEFT = ["result", "check", "sync"];
      var CT_RIGHT = [["executor", "кто исполняет"], ["deps", "зависимости и порядок"],
                      ["inputs", "входы от родителя и соседей"], ["resources", "ресурсы"],
                      ["artifacts", "что произведёт"], ["storage", "где лежит"],
                      ["covers", "что покрывает из цели"]];
      var STOP_KEYS = [["показываю", /(?:показываю|show)\s*:/i], ["увидишь", /(?:увидишь|see)\s*:/i],
                       ["потрогаешь", /(?:потрога(?:ешь|ть)|touch)\s*:/i], ["от тебя", /(?:от тебя|from owner|owner)\s*:/i]];
      function stopHtml(text) {
        var t = String(text || "").replace(/^[-*•]\s+/gm, "");
        var found = [];
        STOP_KEYS.forEach(function (sk) { var m = sk[1].exec(t); if (m) found.push([sk[0], m.index, m.index + m[0].length]); });
        if (found.length < 2) return md(text);
        found.sort(function (a, b) { return a[1] - b[1]; });
        var cells = "";
        found.forEach(function (f, i) {
          var end = i + 1 < found.length ? found[i + 1][1] : t.length;
          var v = t.slice(f[2], end).replace(/^\s*(?:show|see|touch|from owner)\s*:\s*/i, "").replace(/[;·\s]+$/, "").trim();
          cells += '<div><span class="k">' + f[0] + "</span>" + inl(v) + "</div>";
        });
        return '<div class="sg">' + cells + "</div>";
      }
      function contractHtml(n) {
        var f = n.fields || {}, crits = ((d.criteria || []).filter(function (c) { return c.node === n.id; })[0] || {}).items || [];
        var L = "", R = "";
        if (f.result) {
          /* a one-line result reads as a sentence, not a one-item list */
          var rl = String(f.result).split("\n").filter(function (l) { return l.trim(); });
          L += '<div class="res"><div class="lab">' + term("result", "результат — что станет правдой, когда узел закрыт") + "</div>" +
               md(rl.length === 1 ? rl[0].replace(/^\s*[-*•]\s+/, "") : f.result) + "</div>";
        }
        if (f.check) {
          var lines = String(f.check).split("\n").map(function (l) { return l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").trim(); })
                      .filter(function (l) { return l; });
          var met = crits.filter(function (c) { return c.status === "met"; }).length;
          var rows = "";
          lines.forEach(function (l, i) {
            var c = crits[i] || {}, stt = c.status || "open";
            var mk = { met: "✓", failed: "✗", declined: "—", unverified: "?" }[stt] || "·";
            rows += '<div class="ci"><span class="m ' + esc(stt) + '" title="' + esc(VERDICT[stt] ? stt : "") + '">' + mk + "</span><span>" + inl(l) +
                    (c.proof ? ' <span class="pf">— ' + proofHtml(c.proof) + "</span>" : "") + "</span></div>";
          });
          L += '<div><div class="lab">' + term("check", "критерии проверки" + (crits.length ? " · " + met + " / " + crits.length + " сошлись" : "")) +
               '</div><div class="chk">' + rows + "</div></div>";
        }
        if (f.sync) L += '<div class="stop"><div class="lab">' + term("stop", "остановка — что покажу · что увидишь · что потрогаешь · что от тебя") + "</div>" + stopHtml(f.sync) + "</div>";
        var seen = { result: 1, check: 1, sync: 1 };
        CT_RIGHT.forEach(function (kv) {
          var k = kv[0]; seen[k] = 1;
          if (!f[k]) return;
          if (k === "storage" && f.artifacts) { R = R.replace(/<\/div><\/div>$/, '<div class="md"><p><span style="color: var(--muted)">→ где лежит:</span> ' + inl(String(f[k]).replace(/^[-*•]\s+/gm, "").replace(/\n+/g, " · ")) + "</p></div></div></div>"); return; }
          R += '<div class="sd"><div class="lab">' + term(k === "artifacts" && f.storage ? "artifacts · storage" : k, k === "artifacts" && f.storage ? "что произведёт · где лежит" : kv[1]) + "</div>" + md(f[k]) + "</div>";
        });
        Object.keys(f).forEach(function (k) {
          if (seen[k] || !f[k]) return;
          R += '<div class="sd other"><div class="lab">' + term(k, labels[k] || "") + "</div>" + md(f[k]) + "</div>";
        });
        return '<div class="ct"><div class="ctl">' + L + '</div><div class="ctr">' + R + "</div></div>";
      }
  var LVL = { stage: term("stage", "этап"), work_package: term("WP", "пакет работ"),
              work: term("work", "работа"), task: term("task", "задача"),
              subtask: term("subtask", "подзадача") };
  if (d.plan_word) {
    pl += sec("plan.word", term("accept plan", "план принят"), '<div class="plain"><b>' + when(d.plan_word.ts) +
              "</b> · «" + esc(d.plan_word.words) + "»</div>");
  }
  /* ЦЕЛОСТНОСТЬ МАРШРУТА (его решение 2026-08-24) — проверка СВЕРХУ ВНИЗ: за каждым куском
     цели кто-то стоит. Стоит в ленте плана, потому что это свойство плана: свёртка снизу
     говорит «обещанное сделано», целостность сверху — «нужное обещано». */
  var ig = d.integrity || null;
  if (ig && ig.kinds && ig.kinds.length) {
    var gh = '<div class="plain">', nHole = 0, nAll = 0, nOk = 0;
    ig.kinds.forEach(function (k) {
      if (!k.items.length) return;
      gh += '<div class="crit-node">' + esc(k.title) + "</div>";
      k.items.forEach(function (it) {
        nAll++;
        var by = (it.by || []), unf = (it.unfolded || []);
        var cls = by.length ? "met" : unf.length ? "unverified" : "failed";
        var word = by.length ? "покрыт" : unf.length ? "раскроется" : "НИКТО";
        if (by.length || unf.length) nOk++; else nHole++;
        gh += '<div class="crit"><span class="v ' + cls + '">' + word + "</span><span>" +
              inl(it.text) + "</span>" +
              ((by.length || unf.length)
                ? '<span class="proof">' + esc(by.concat(unf).join(", ")) +
                  (unf.length ? " · план достроится позже" : "") + "</span>" : "");
        gh += "</div>";
      });
    });
    if (ig.orphans && ig.orphans.length)
      gh += '<div class="crit"><span class="v unverified">ничьи</span><span>' +
            esc(ig.orphans.join(", ")) + " — эти ветки не работают ни на один кусок цели</span></div>";
    gh += "</div>";
    pl += sec("plan.integrity", term("integrity", "целостность маршрута") + ' <span class="n">' + nOk + "/" + nAll +
              "</span>" + (nHole ? ' <span class="n">дыр: ' + nHole + "</span>" : ""), gh, true);
  }
  var nodes = d.plan_nodes || [];
  if (nodes.length || d.plan) {
    if (d.plan) {
      pl += sec("plan.network", term("plan.md", "сетевой план"), box("plan.md", "plan.md", md(d.plan), false));
    }
    if (nodes.length) {
      var byId = {}, kids = {}, roots = [];
      nodes.forEach(function (n) { byId[n.id] = n; kids[n.id] = []; });
      nodes.forEach(function (n) {
        var p = /[.\-]/.test(n.id) ? n.id.replace(/[.\-][^.\-]+$/, "") : "";
        if (p && byId[p]) kids[p].push(n); else roots.push(n);
      });
      var labels = d.node_labels || {};
      function renderNode(n) {
        var key = "plan.node." + n.id;
        var st = n.status || "open";
        var STATUS = { active: "▶ " + term("active", "в работе"), waiting: "⏸ " + term("waiting", "ждёт владельца"),
                       blocked: "✗ " + term("blocked", "заблокирован"), parked: "⏹ " + term("parked", "отложен") };
        var stBadge = st === "done" ? '<span class="done">✓ ' + term("done", "закрыт") + "</span>" :
                      STATUS[st] ? '<span class="lvl">' + STATUS[st] + "</span>" : "";
        var ch = kids[n.id];
        var out = '<details class="node" data-key="' + esc(key) + '"' +
                  (isOpen(key, false) ? " open" : "") + '><summary><span class="nid">' +
                  esc(n.id.toUpperCase()) + '</span><span class="nname">' + esc(n.name) +
                  "</span>" + (LVL[n.level] ? '<span class="lvl">' + LVL[n.level] + "</span>" : "") +
                  stBadge + (ch.length ? '<span class="lvl">внутри ' + ch.length + "</span>" : "") +
                  "</summary><div class=\"nbody\">";
        /* суть — первая строка результата, без раскрытия контракта */
        var gist = ((n.fields || {}).result || "").split("\n").filter(function (l) { return l.trim(); })[0] || "";
        if (gist) out += '<div class="ngist">' + inl(gist.replace(/^[-*•]\s+/, "")) + "</div>";
        var wlN = WL[n.id] || [];
        if (wlN.length)
          out += box(key + ".log", term("log", "ход работы") + ' <span class="n">' + wlN.length + "</span>",
                     wlRows(wlN), false);
        var fk = Object.keys(n.fields || {});
        if (fk.length) out += box(key + ".fields", term("contract", "контракт узла") + ' <span class="n">' + fk.length + " полей</span>",
                                  contractHtml(n), false);
        if (ch.length) {
          out += '<div class="nkids">внутри · ' + ch.length + "</div>";
          ch.forEach(function (c) { out += renderNode(c); });
        }
        out += "</div></details>";
        return out;
      }
      var th = "";
      roots.forEach(function (n) { th += renderNode(n); });
      pl += sec("plan.tree", term("nodes", "дерево узлов"), th);
    }
  }
  h += band("plan", pl);

  /* 4 · ИСПОЛНЕНИЕ — ЖИВАЯ ДОСКА (владелец, 2026-08-22: «в исполнении не было видно, над чем
     именно мы работаем»): сейчас · прогресс · узлы по статусам · карточка активного узла с
     критериями, следами и дизайном. План остаётся контрактом, здесь — ход работы. */
  var ex = "";
  var xd = d.exec || null;
  var STN = { active: term("active", "в работе"), waiting: term("waiting", "ждёт владельца"),
              blocked: term("blocked", "заблокировано"), open: term("open", "осталось"),
              parked: term("parked", "отложено"), done: term("done", "сделано") };
  var STM = { active: "▶", waiting: "⏸", blocked: "✗", open: "·", parked: "⏹", done: "✓" };
  if (xd && xd.nodes && xd.nodes.length) {
    var byS = {};
    xd.nodes.forEach(function (n) { (byS[n.status] = byS[n.status] || []).push(n); });
    var doneN = (byS.done || []).length, totalN = xd.nodes.length;
    var cT = 0, cD = 0;
    xd.nodes.forEach(function (n) { cT += n.crit_total; cD += n.crit_done; });
    var actN = null;
    xd.nodes.forEach(function (n) { if (n.id === xd.active) actN = n; });
    var now = actN
      ? '<span class="exmark">▶</span> ' + esc(actN.id) + " · " + esc(actN.name) +
        (actN.started_at ? ' <span class="lvl">в работе с ' + when(actN.started_at) + "</span>" : "")
      : (xd.waiting.length ? '<span class="exmark">⏸</span> ждём владельца: ' + esc(xd.waiting.join(", "))
                           : (doneN === totalN ? "все узлы закрыты" : "в работе никого"));
    var nh = '<div class="plain"><div class="exnow">' + now + "</div>" +
             '<div class="exprog">узлов закрыто ' + doneN + "/" + totalN +
             " · критериев с вердиктом " + cD + "/" + cT +
             (xd.stops && xd.stops.total ? " · остановок пройдено " + xd.stops.passed + "/" + xd.stops.total : "") +
             "</div>";
    if (d.stale)
      nh += '<div class="exwait">⚠ брошен? ' + esc(d.stale.id) + " в работе, последний след " +
            (d.stale.hours >= 48 ? Math.floor(d.stale.hours / 24) + " дн." : d.stale.hours + " ч") +
            " назад · с тех пор " + d.stale.stray + " запис(ей) мимо узла — агент должен закрыть, " +
            "поставить ждать, отложить или сменить узел с причиной</div>";
    (byS.waiting || []).forEach(function (n) {
      nh += '<div class="exwait">⏸ ' + esc(n.id) + " ждёт владельца" + (n.note ? " — " + inl(n.note) : "") +
            '<span class="lvl"> · агент не трогает этот сценарий</span></div>';
    });
    nh += "</div>";
    ex += sec("exec.now", term("now", "сейчас и прогресс"), nh);
    if (actN) {
      var ah = '<div class="plain">';
      if (actN.result) ah += '<div class="nfield"><b>результат</b>' + md(actN.result) + "</div>";
      var cn = (d.criteria || []).filter(function (c) { return c.node === actN.id; })[0];
      if (cn) {
        ah += '<div class="nfield"><b>критерии · ' + actN.crit_done + "/" + actN.crit_total + "</b>";
        cn.items.forEach(function (c) {
          ah += '<div class="crit"><span class="v ' + esc(c.status) + '">' +
                (VERDICT[c.status] || esc(c.status)) + "</span><span>" + inl(c.text) + "</span>" +
                (c.proof ? '<span class="proof">' + proofHtml(c.proof) + "</span>" : "") + "</div>";
        });
        ah += "</div>";
      }
      function fileLinks(folder, list) {
        return list.map(function (f) {
          return '<a href="' + encodeURI(folder + "/" + f) + '">' + esc(f) + "</a>";
        }).join(" · ");
      }
      ah += '<div class="nfield"><b>следы</b><div>артефакты: ' +
            (actN.artifacts.length ? fileLinks("artifacts", actN.artifacts) : "—") +
            "<br>доказательства: " + (actN.evidence.length ? fileLinks("evidence", actN.evidence) : "—") +
            "</div></div>";
      var wlA = WL[actN.id] || [];
      ah += '<div class="nfield"><b>' + term("log", "ход работы") + " · " + wlA.length + "</b>" +
            (wlA.length ? wlRows(wlA.slice(-6)) + (wlA.length > 6 ? '<div class="fsub">… и ещё ' + (wlA.length - 6) + " раньше — в дереве узлов</div>" : "")
                        : '<div class="fsub">пусто — агент пишет el log по ходу, и это ложится сюда</div>') + "</div>";
      if (actN.stop) ah += '<div class="nfield"><b>остановка</b><div>' + esc(actN.stop) + "</div></div>";
      (actN.design || []).forEach(function (g) {
        ah += '<div class="nfield"><b>дизайн-контракт</b><div>' + esc(g.fork) +
              (g.fidelity ? " · обязательность: " + esc(g.fidelity) : "") +
              (g.preview ? ' · <a class="prev" href="' + encodeURI(g.preview) + '" target="_blank">открыть превью ↗</a>' : "") +
              "</div></div>";
      });
      ah += "</div>";
      ex += sec("exec.active", term("active node", "активный узел") + " — " + esc(actN.id), ah);
    }
    var rows = "";
    ["active", "waiting", "blocked", "open", "parked", "done"].forEach(function (stt) {
      var list = byS[stt] || [];
      if (!list.length) return;
      rows += '<div class="crit-node">' + STN[stt] + ' <span class="n">' + list.length + "</span></div>";
      list.forEach(function (n) {
        rows += '<div class="exrow"><span class="exmark">' + STM[stt] + '</span><span class="nid">' + esc(n.id) +
                "</span> " + esc(n.name) + ' <span class="lvl">' +
                (n.crit_total ? n.crit_done + "/" + n.crit_total + " критериев" : "") +
                (n.artifacts.length || n.evidence.length ? " · следов " + (n.artifacts.length + n.evidence.length) : "") +
                (WL[n.id] && WL[n.id].length ? " · ход " + WL[n.id].length : "") +
                (n.stop ? " · " + esc(n.stop) : "") + "</span>" +
                (n.note ? '<div class="fsub">' + inl(n.note) + "</div>" : "") + "</div>";
      });
    });
    ex += sec("exec.board", term("board", "доска узлов"), '<div class="plain">' + rows + "</div>");
  }
  var exf = filesBox("artifacts", "Артефакты") + filesBox("evidence", "Доказательства");
  if (exf) ex += sec("exec.files", term("artifacts · evidence", "произведено и доказано"), exf);
  h += band("execute", ex);

  /* 5 · ПРОВЕРКА — матрёшка (владелец, 2026-08-23): один закон на все уровни — проверка
     узла = свои критерии + свёртка детей; корень — сама задача: её собственные критерии —
     чек-лист приёмки (IFR), её дети — этапы, над всем — слово человека. Строка узла
     раскрывается в критерии и детей, как дерево плана. */
  var va = "";
  var crit = d.criteria || [];
  var ROLL = { ok: "сошлось", failed: "не сошлось", debt: "не проверено",
               open: "открыто", empty: "—" };
  var RCLS = { ok: "met", failed: "failed", debt: "unverified", open: "open", empty: "open" };
  var nCrit = crit.reduce(function (s, n) { return s + n.items.length; }, 0);
  if (nCrit) {
    var vById = {}, vKids = {}, vRoots = [];
    crit.forEach(function (n) { vById[n.node] = n; vKids[n.node] = []; });
    crit.forEach(function (n) {
      var p = n.parent || "";
      if (p && vById[p]) vKids[p].push(n); else vRoots.push(n);
    });
    function critRows(items) {
      var out = "";
      (items || []).forEach(function (c) {
        out += '<div class="crit"><span class="v ' + esc(c.status) + '">' +
               (VERDICT[c.status] || esc(c.status)) + "</span><span>" + inl(c.text) + "</span>" +
               (c.proof ? '<span class="proof">' + proofHtml(c.proof) + "</span>" : "") + "</div>";
      });
      return out;
    }
    function renderVal(n) {
      var key = "val.node." + n.node;
      var verdict = n.verdict || "open";
      var cnt = n.own && n.own[1] ? "свои " + n.own[0] + "/" + n.own[1] : "";
      if (n.sub && n.own && n.sub[1] !== n.own[1])
        cnt += (cnt ? " · " : "") + "всего " + n.sub[0] + "/" + n.sub[1];
      var out = '<details class="node" data-key="' + esc(key) + '"' +
                (isOpen(key, !(n.depth > 0)) ? " open" : "") + '><summary>' +
                '<span class="v ' + (RCLS[verdict] || "open") + '">' +
                (ROLL[verdict] || verdict) + '</span><span class="nid">' + esc(n.node) +
                '</span><span class="nname">' + esc(n.name || "") + "</span>" +
                (cnt ? '<span class="lvl">' + cnt + "</span>" : "") +
                '</summary><div class="nbody">' + critRows(n.items);
      (vKids[n.node] || []).forEach(function (c) { out += renderVal(c); });
      out += "</div></details>";
      return out;
    }
    var vh = '<div class="vtree">';
    var vr = d.val_root || null;
    if (vr) {
      vh += '<div class="vroot"><span class="v ' + (RCLS[vr.verdict] || "open") + '">' +
            (ROLL[vr.verdict] || vr.verdict) + "</span><b>задача целиком</b><span>" +
            vr.done + "/" + vr.total + " с вердиктом" +
            (vr.failed ? " · не сошлось " + vr.failed : "") +
            (vr.unverified ? " · не проверено " + vr.unverified : "") +
            (vr.ifr && vr.ifr[1] ? " · чек-лист ИФР " + vr.ifr[0] + "/" + vr.ifr[1] : "") +
            "</span>" +
            (vr.word ? '<span class="vword">слово приёмки: «' + esc(vr.word.words) + "»</span>"
                     : '<span class="vword none">слова приёмки ещё нет</span>') +
            "</div>";
    }
    vRoots.forEach(function (n) { vh += renderVal(n); });
    vh += "</div>";
    va += sec("val.criteria", term("criteria", "критерии валидации") + ' <span class="n">' + nCrit + "</span>", vh);
  }
  h += band("validate", va);

  /* 6 · УРОКИ · 7 · СВЕРКА · 8 · ЗАКРЫТИЕ — из журнала: уроки, решения по направлению,
     запись о закрытии. */
  var journal = d.journal || [];
  function eventList(items, fmt) {
    if (!items.length) return "";
    return '<div class="plain">' + items.map(function (e) {
      return '<div class="entry"><div class="top"><span>' + when(e.ts) + "</span></div>" +
             '<div class="text">' + fmt(e) + "</div></div>";
    }).join("") + "</div>";
  }
  var lessons = journal.filter(function (e) { return e.type === "lesson"; });
  h += band("reflect", lessons.length ? sec("reflect.lessons", term("lessons", "уроки"),
            eventList(lessons, function (e) { return inl(e.text || ""); })) : "");
  var turns = journal.filter(function (e) {
    return (e.type === "advance" && /^align/.test(e.text || "")) || e.type === "reroute";
  });
  h += band("align", turns.length ? sec("align.turns", term("align", "решения по направлению"),
            eventList(turns, function (e) {
              return "<b>" + esc(e.text || "") + "</b>" + (e.why ? " — " + inl(e.why) : "");
            })) : "");
  var dones = journal.filter(function (e) { return e.type === "done" || e.type === "reopened"; });
  h += band("close", dones.length ? sec("close.done", term("done", "закрытие"),
            eventList(dones, function (e) {
              return (e.type === "reopened" ? "<b>открыта заново</b> — " :
                      "<b>" + esc(e.outcome || "закрыта") + "</b> — ") + inl(e.text || "") +
                     (e.dirty ? '<div class="proof">без коммита: ' + esc(e.dirty) + "</div>" : "");
            })) : "");
  /* ПОПРАВКИ — что изменили в документах уже пройденных этапов, одним списком по времени
     (владелец, 2026-08-23: карточки лежали каждая под своим документом, бейдж только считал —
     негде было увидеть «что изменилось после того, как я подтвердил»). Строка = оглавление:
     полный текст живёт в карточке под документом, ссылка ведёт туда. «ждёт подтверждения» —
     поправка позже твоего последнего записанного слова: то, что ты подтверждал, с тех пор
     изменилось (тот же признак, что у `el next`). */
  function docLabel(a) {
    var k = a.key || "";
    if (k === "ctx.scope.5w") return "5W+1H — границы" + (a.dim ? " · " + esc(a.dim) : "");
    if (k.indexOf("ctx.frame.") === 0) {
      var fk = k.slice(10), f = FRAME.filter(function (x) { return x[0] === fk; })[0];
      return f ? f[1] : fk;
    }
    if (k.indexOf("ifr.") === 0) {
      var ik = k.slice(4), g = IFRP.filter(function (x) { return x[0] === ik; })[0];
      return ik === "ideal" ? "Сам идеал — одним абзацем" : (g ? g[1] : ik);
    }
    var fixed = { "ctx.clarified": "Задача после уточнений", "ctx.summary": "Summary — свёртка контекста",
                  "ctx.unknown": "Чего я не знаю (unknown)", "ctx.qa": "Вопросы и ответы",
                  "think.tools": "Приёмы думания", "plan.md": "План — карта маршрута",
                  "plan.tree": "Дерево узлов" };
    if (fixed[k]) return fixed[k];
    if (k.indexOf("think.") === 0) {
      var tk = k.slice(6), t = tsteps.filter(function (x) { return x[0] === tk; })[0];
      return t ? t[1] : tk;
    }
    return a.rel || a.part || "документ";
  }
  var amHtml = "";
  if (amList.length) {
    var rows = "";
    amList.slice().reverse().forEach(function (a) {
      var st = a.pending ? ["pending", "ждёт подтверждения"] :
               a.covered_by === "assume" ? ["loan", "принято за тебя — долг"] : ["ok", "подтверждено тобой"];
      rows += '<div class="amrow">' +
              '<span class="v ' + st[0] + '">' + st[1] + "</span>" +
              "⟲ " + (a.late ? "поздний след" : "п" + esc(a.n)) + " · " + when(a.ts) +
              " · phase: " + phT(a.phase) +
              ' · <span class="doc">' + esc(docLabel(a)) + "</span> " +
              '<span class="rel">' + esc(a.rel) + "</span>" +
              (a.key ? ' <a class="jump" href="#" data-jump="' + esc(a.key) + '" data-n="' +
                       esc(a.n == null ? "" : a.n) + '">→ к документу</a>' : "") +
              (a.why ? '<div class="fsub"><b>почему:</b> ' + inl(a.why) + "</div>" : "") +
              (a.refs && a.refs.length ? '<div class="fsub"><b>основание:</b> ' + inl(a.refs.join(" · ")) + "</div>" : "") +
              "</div>";
    });
    amHtml = sec("amend", term("amend", "поправки — что изменилось задним числом") + ' <span class="n">' + amList.length +
                 (nPend ? " · ждёт подтверждения " + nPend : "") + "</span>",
                 '<div class="plain">' + rows + "</div>", !!nPend);
  }
  h = h.replace("<!--AMEND-->", amHtml);
  document.getElementById("main").innerHTML = h;

  /* ПЕРЕХОД К ДОКУМЕНТУ — раскрыть все папки на пути, прокрутить, мигнуть карточкой поправки. */
  function jumpTo(key, n) {
    var el = document.querySelector('details[data-key="' + key + '"]');
    if (!el) return;
    for (var p = el; p; p = p.parentElement) {
      if (p.tagName === "DETAILS" && !p.open) { p.open = true; mem[p.getAttribute("data-key")] = true; }
    }
    try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {}
    var target = el;
    if (n) {
      var cards = el.querySelectorAll(".amend, .amend-notes");
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].textContent.indexOf("п" + n + " ") >= 0 || cards[i].textContent.indexOf("п" + n + " ·") >= 0) { target = cards[i]; break; }
      }
    }
    /* a card goes to the centre — the sticky band header would cover its top otherwise */
    target.scrollIntoView({ behavior: "smooth", block: target === el ? "start" : "center" });
    target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("[data-jump]") : null;
    if (!a) return;
    ev.preventDefault();
    jumpTo(a.getAttribute("data-jump"), a.getAttribute("data-n"));
  });

  /* ВТОРОСТЕПЕННОЕ — свёрнуто, раскрывается по клику: файлы без этапа и журнал целиком. */
  var s = filesBox("init", "Начало") + filesBox("notes", "Заметки");
  var entries = journal.slice().reverse();
  var jh = "";
  if (!entries.length) jh += '<div class="empty">Записей пока нет.</div>';
  entries.forEach(function (e) {
    jh += '<div class="entry"><div class="top"><span class="type' +
          (/^(grant|halt|assume|owe|owe-holds|owe-paid|owe-drop)$/.test(e.type || "") ? " loan" : "") + '">' + esc(e.type || "") +
          "</span><span>" + when(e.ts) + "</span></div>" +
          '<div class="text">' + esc(e.text || e.short || "") +
          (e.detail ? "\n" + esc(e.detail) : "") + "</div></div>";
  });
  /* СЛОВАРЬ — как сказать агенту: термин · по-русски · команда. Один список на страницу. */
  var WORDS = [
    ["context", "фаза 1 — контекст: что у нас есть", "el context"],
    ["think", "фаза 2 — думать: варианты, развилки, кристалл", "el think"],
    ["plan", "фаза 3 — план: узлы, зависимости, контракты", "el plan"],
    ["execute", "фаза 4 — исполнение: узел за узлом", "el plan start <узел>"],
    ["validate", "фаза 5 — проверка на живом, вердикты", "el validate"],
    ["reflect", "фаза 6 — уроки", "el lesson"],
    ["align", "фаза 7 — сверка: куда дальше", "el forward --why · el phase <фаза> --why"],
    ["close", "фаза 8 — закрытие", "el done"],
    ["forward", "перейти на следующую фазу с основанием", "el forward --why"],
    ["mode · light / soft / strict", "режим строгости: лёгкий · мягкий · строгий", "el mode"],
    ["request", "запрос человека, слово в слово", "init/request.md"],
    ["qa", "вопросы и ответы по областям", "el context qa"],
    ["scope · 5W+1H", "рамка задачи: что · зачем · кто · где · когда · как", "context/5w-h.md"],
    ["requirements · constraints · limitations", "требования · ограничения снаружи · пределы", "el context add"],
    ["IFR", "идеальный финальный результат — глазами пользователя", "context/ifr.md"],
    ["clarified", "задача после уточнений", "context/task.clarified.md"],
    ["summary", "свёртка контекста — что установлено фактом", "context/summary.md"],
    ["unknown", "чего я не знаю — явный вопрос перед спуском", "context/unknown.md"],
    ["fork · decide", "развилка и её выбор", "el think decide <id>"],
    ["ideals · crystal", "семья идеалов · как вызревало решение", "thinking/"],
    ["node · stage · WP", "узел плана · этап · пакет работ", "el plan new"],
    ["result · check · artifacts", "поля узла: результат · критерии · артефакты", "el plan set"],
    ["active · waiting · blocked · parked · done", "узел: в работе · ждёт владельца · заблокирован · отложен · закрыт", "el plan wait / block / park / done"],
    ["criteria · verdict: met / failed / open", "критерии и вердикты: сошёлся / не сошёлся / не проверялся", "el validate"],
    ["evidence · artifacts", "доказательства · произведённое", "el evidence <файл> · el artifact <файл>"],
    ["accept", "слово человека — над планом, узлом, результатом", "el accept --for"],
    ["grant · assume · debt · halt", "автономия: грант · займ слова · долг · остановка", "el grant / el halt"],
    ["owed · owe", "за тобой: ответы, которые есть только у тебя", "el owe / el owe answer"],
    ["todo · --every", "на потом: обещание к фазе · напоминание", "el todo"],
    ["log", "ход работы: что сделано по узлу, по ходу", "el log \"…\" → узел в работе · --node · --free"],
    ["switch", "сменить узел в работе — только с причиной", "el plan start <узел> --switch \"…\""],
    ["amend", "поправка документа задним числом", "el context <раздел> \"…\" --why"],
    ["brief", "листок агента — что знать, возвращаясь", "el brief"],
    ["lessons · journal", "уроки · журнал событий", "el lesson · journal.jsonl"],
    ["completed · closed · dropped · blocked", "исход: доехали · закрыто пониманием · снята · заблокирована", "el done --as"],
  ];
  var wh = '<div class="plain">';
  WORDS.forEach(function (w) {
    wh += '<div class="wrow"><span class="t">' + esc(w[0]) + '</span><span class="ru">' + esc(w[1]) +
          '</span><span class="cmd">' + esc(w[2]) + "</span></div>";
  });
  wh += "</div>";
  s += sec("words", term("words", "словарь — как сказать агенту") +
           ' <span class="n">' + WORDS.length + "</span>", wh, false);
  s += box("journal", term("journal", "журнал") + ' <span class="n">' + entries.length + "</span>", jh, false);
  document.getElementById("second").innerHTML = sec("details", "Подробности", s);

  /* remember every toggle — the user's hand, not the defaults: listeners go on AFTER the
     stored state was already written into the markup above */
  Array.prototype.forEach.call(document.querySelectorAll("details[data-key]"), function (el) {
    el.addEventListener("toggle", function () {
      mem[el.getAttribute("data-key")] = el.open;
      try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {}
    });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обзор проекта</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e3e2de; --accent: #3b6ea5; --done: #4a7c59; --bad: #b0563e;
    --warn: #b07d2e; --loan: #b45309; --closed: #8a8a8e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --ink: #ececee; --muted: #98989d;
      --line: #3a3a3e; --accent: #7aa5d2; --done: #85b795; --bad: #d08770;
      --warn: #d0a35c; --loan: #e0a35c; --closed: #7c7c80;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px;
  }
  a { color: var(--accent); }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--accent); }
  /* ШАПКА — паспорт проекта (владелец, 2026-08-25): статус словом, даты с годом и «сколько
     назад», сколько в работе, режим, узлы; id и папка копируются одной кнопкой; полоса фаз —
     последняя строка той же карточки. */
  .htop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
          flex-wrap: wrap; }
  .hgen { color: var(--muted); font-size: 13px; }
  .hgen code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .hstatus { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap;
             font-size: 13px; color: var(--muted); }
  .hpill { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 99px;
           font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); line-height: 1.45;
           white-space: nowrap; }
  .hpill.done { background: var(--done); }
  .hpill.closed { background: var(--closed); }
  .hpill.bad { background: var(--bad); }
  h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 0; }
  .hcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           margin: 12px 0 26px; }
  .hrow { padding: 12px 18px; border-top: 1px solid var(--line); }
  .hrow:first-child { border-top: none; }
  .hident { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 18px; }
  .hwhere { overflow-wrap: anywhere; min-width: 0; }
  .hwhere code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .hwhere .hpath { color: var(--muted); font-size: 12.5px; }
  .hwhere .hid { font-weight: 600; }
  .hbtns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .cbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
          background: var(--card); color: var(--muted); border-radius: 8px; font: inherit;
          font-size: 12.5px; line-height: 1.2; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  .cbtn:hover { border-color: var(--accent); color: var(--accent); }
  .cbtn.ok { border-color: var(--done); color: var(--done); }
  .cbtn.bad { border-color: var(--bad); color: var(--bad); }
  .cbtn.ok svg, .cbtn.bad svg { display: none; }
  .hfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;
            padding: 12px 18px 13px; }
  .fact .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .fact .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .fact .v.done { color: var(--done); }
  .fact .v.closed { color: var(--closed); }
  .fact .v.bad { color: var(--bad); }
  .fact .s { font-size: 12.5px; color: var(--muted); }
  /* СЛОВА (владелец, 2026-08-25): термин — по-английски, как его зовёт el и агент; рядом
     приглушённо — русское пояснение. Человек читает по-русски, а называет словами CLI. */
  .t { font-family: ui-monospace, Menlo, monospace; font-weight: 600; letter-spacing: 0; }
  .g { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted);
       margin-left: 6px; font-size: .9em; }
  .ph .g { margin-left: 5px; font-size: 12px; }
  .ph.current .g, .ph.finish .g, .hpill .g { color: rgba(255,255,255,.82); }
  .hpill .g { font-size: 12px; }
  .band-h .bname .g { font-size: 13px; font-weight: 400; }
  details.node > summary .lvl .g, .exrow .lvl .g, .crit .v .g, .vtree summary .v .g, .vroot .v .g,
  .loan-row .v .g, .owe-row .v .g { margin-left: 4px; font-size: 11px; }
  .wrow { display: grid; grid-template-columns: 250px 1fr auto; gap: 12px; padding: 6px 0;
          border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .wrow:first-child { border-top: none; }
  .wrow .cmd { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--accent);
               white-space: nowrap; }
  .wrow .ru { color: var(--ink); }
  .wrow .ru small { color: var(--muted); }
  .phases { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 18px 14px; }
  .ph {
    padding: 5px 12px; border-radius: 99px; font-size: 13px;
    border: 1px solid var(--line); color: var(--muted); background: var(--card);
  }
  .ph.passed { color: var(--done); border-color: var(--done); }
  .ph.current { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .ph.finish { color: #fff; background: var(--done); border-color: var(--done); font-weight: 600; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--muted); margin: 26px 0 10px; }
  .result { background: var(--card); border: 1px solid var(--done);
            border-radius: 12px; padding: 14px 18px; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .plain { background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 14px 18px; }
  details.box { background: var(--card); border: 1px solid var(--line);
                border-radius: 12px; padding: 0; margin-bottom: 10px; }
  details.box > summary {
    cursor: pointer; padding: 12px 18px; font-weight: 600; list-style: none;
    display: flex; align-items: baseline; gap: 8px;
  }
  details.box > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
  details.box[open] > summary::before { content: "▾"; }
  details.box > summary .n { color: var(--muted); font-weight: 400; font-size: 13px; }
  details.box > .body { padding: 2px 18px 14px; }
  .qa { border-top: 1px solid var(--line); padding: 10px 0; }
  .qa:first-child { border-top: none; }
  .qa .q { font-weight: 600; }
  .qa .q .area { font-weight: 400; font-size: 12px; color: var(--accent);
                 border: 1px solid var(--accent); border-radius: 99px;
                 padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  .qa .a { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa .a.blank { color: var(--muted); font-style: italic; }
  .qa .q .area.loan { color: var(--loan); border-color: var(--loan); }
  .dim ul { margin: 4px 0 8px 20px; padding: 0; }
  .dim .out { color: var(--muted); }
  .dim .out::before { content: "не входит: "; }
  .dim .blur { color: var(--muted); font-style: italic; }
  .dim .blur::before { content: "размыто: "; }
  .dim .struck { text-decoration: line-through; color: var(--muted); }
  /* ПОПРАВКИ — карточка под исходным текстом: когда · фаза · почему · основание. */
  .amend { border-left: 3px solid var(--warn); margin-top: 12px; padding: 8px 12px;
           background: var(--bg); border-radius: 0 8px 8px 0; }
  .amend-h { font-size: 12px; font-weight: 600; color: var(--warn); margin-bottom: 2px; }
  .amend-why { font-size: 13px; color: var(--muted); }
  .amend-notes { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
  .subh { font-weight: 600; color: var(--accent); }
  /* MARKDOWN — что рендерит md(): абзацы, списки, заголовки, код, цитаты. */
  .md p { margin: 0 0 8px; overflow-wrap: anywhere; }
  .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 4px 0 8px 22px; padding: 0; }
  .md li { margin: 2px 0; overflow-wrap: anywhere; }
  .md .mh { font-weight: 600; margin: 10px 0 4px; }
  .md .mh:first-child { margin-top: 0; }
  .md .mh1 { font-size: 17px; }
  .md .mh2 { font-size: 15px; color: var(--accent); }
  .md .mh3, .md .mh4 { font-size: 14px; color: var(--muted); }
  .md code, .fork code, .crit code, .qa code { font-family: ui-monospace, Menlo, monospace;
    font-size: 13px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .md blockquote { border-left: 3px solid var(--line); margin: 6px 0; padding: 2px 10px;
                   color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .nfield .md { margin-top: 2px; }
  .ph.amend-badge { color: var(--warn); border-color: var(--warn); }
  .ph.mode-badge { color: var(--muted); border-style: dashed; }
  /* АВТОНОМИЯ — кредит слова: выдана (синий) · остановлена (красный, залит) · долг (янтарь). */
  .ph.auto-badge { color: var(--accent); border-color: var(--accent); }
  .ph.auto-badge.halt { color: #fff; background: var(--bad); border-color: var(--bad); font-weight: 600; }
  .ph.loan-badge { color: var(--loan); border-color: var(--loan); }
  /* ЗА ТОБОЙ — ответы, которые есть только у человека, и их пока нет; «стоим» — залито. */
  .ph.owe-badge { color: var(--warn); border-color: var(--warn); cursor: pointer; }
  .ph.owe-badge.stand { color: #fff; background: var(--bad); border-color: var(--bad); font-weight: 600; }
  .ph.owe-badge:hover { background: var(--warn); color: #fff; }
  .owe-row { border-top: 1px solid var(--line); padding: 8px 0; overflow-wrap: anywhere; }
  .owe-row:first-child { border-top: none; }
  .owe-row .v { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
                border: 1px solid var(--line); margin-right: 8px; white-space: nowrap; }
  .owe-row .v.stand { color: #fff; background: var(--bad); border-color: var(--bad); }
  .owe-row .v.held { color: var(--warn); border-color: var(--warn); }
  .owe-row .v.free { color: var(--muted); }
  .owe-row .v.paid { color: var(--done); border-color: var(--done); }
  .owe-row .v.drop { color: var(--muted); }
  .owe-row .kind { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .owe-row .fsub { font-size: 13px; color: var(--muted); margin-left: 2px; }
  .owe-row.closed { opacity: .72; }
  .owe-row .over { color: var(--bad); font-weight: 600; }
  .halt { background: var(--card); border: 2px solid var(--bad); border-radius: 12px;
          padding: 14px 18px; }
  .halt .hh { color: var(--bad); font-weight: 700; font-size: 13px; text-transform: uppercase;
              letter-spacing: .04em; margin-bottom: 4px; }
  .halt .hmeta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .loan-row { border-top: 1px solid var(--line); padding: 8px 0; overflow-wrap: anywhere; }
  .loan-row:first-child { border-top: none; }
  .loan-row .v { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
                 border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
  .loan-row .v.grant { color: var(--accent); border-color: var(--accent); }
  .loan-row .v.halt { color: var(--bad); border-color: var(--bad); }
  .loan-row .v.debt { color: var(--loan); border-color: var(--loan); }
  .loan-row .v.paid { color: var(--done); border-color: var(--done); }
  .loan-row .scope { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
                     color: var(--accent); margin-right: 4px; }
  .loan-row .fsub { font-size: 13px; color: var(--muted); margin-left: 2px; }
  .entry .type.loan { color: var(--loan); }
  /* ПОПРАВКИ ОДНИМ СПИСКОМ — строка на поправку: статус · номер · когда · этап · документ · почему. */
  .ph.amend-badge[data-jump] { cursor: pointer; }
  .ph.amend-badge[data-jump]:hover { background: var(--warn); color: #fff; }
  .amrow { border-top: 1px solid var(--line); padding: 8px 0; overflow-wrap: anywhere; }
  .amrow:first-child { border-top: none; }
  .amrow .v { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
              border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
  .amrow .v.pending { color: var(--warn); border-color: var(--warn); }
  .amrow .v.ok { color: var(--done); border-color: var(--done); }
  .amrow .v.loan { color: var(--loan); border-color: var(--loan); }
  .amrow .doc { font-weight: 600; }
  .amrow .rel { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); }
  .amrow .fsub { font-size: 13px; color: var(--muted); margin-left: 2px; }
  .amrow a.jump { font-size: 13px; margin-left: 6px; white-space: nowrap; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--warn); } 100% { box-shadow: none; } }
  .flash { animation: flash 1.6s ease-out 1; border-radius: 8px; }
  /* СЕКЦИИ — заголовок и есть ручка: клик сворачивает, состояние помнится. */
  details.sec { margin-top: 26px; }
  details.sec > summary { font-size: 15px; text-transform: uppercase; letter-spacing: .04em;
                          color: var(--muted); margin: 0 0 10px; cursor: pointer;
                          list-style: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸ "; font-size: 12px; }
  details.sec[open] > summary::before { content: "▾ "; }
  details.sec > summary .n { font-weight: 400; font-size: 13px; text-transform: none;
                             letter-spacing: 0; }
  details.band > details.sec { margin-top: 16px; }
  details.band > details.sec:first-of-type { margin-top: 8px; }
  details.band > summary { list-style: none; cursor: pointer; }
  details.band > summary::-webkit-details-marker { display: none; }
  /* ЛЕНТЫ ЭТАПОВ — липкая полоса с номером, именем и состоянием этапа. */
  details.band { margin-top: 30px; }
  .band-h { position: sticky; top: 0; z-index: 5; display: flex; align-items: baseline;
            gap: 10px; padding: 10px 0 6px; margin-bottom: 2px; background: var(--bg);
            border-bottom: 2px solid var(--line); }
  .band-h .bn { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
                color: var(--muted); border: 1px solid var(--line); border-radius: 99px;
                padding: 0 8px; }
  .band-h .bname { font-size: 15px; font-weight: 700; text-transform: uppercase;
                   letter-spacing: .06em; }
  .band-h .btitle { font-size: 14px; color: var(--muted); }
  .band-h .bmark { margin-left: auto; font-size: 13px; color: var(--muted); }
  details.band.passed .band-h { border-bottom-color: var(--done); }
  details.band.passed .bname, details.band.passed .bmark, details.band.passed .bn
    { color: var(--done); border-color: var(--done); }
  details.band.current .band-h { border-bottom-color: var(--accent); }
  details.band.current .bname, details.band.current .bmark, details.band.current .bn
    { color: var(--accent); border-color: var(--accent); }
  details.band.ahead .bname { color: var(--muted); }
  .band-empty { color: var(--muted); font-size: 14px; font-style: italic; padding: 6px 0 2px; }
  /* РАЗВИЛКИ — вопрос, кто решает, варианты с ценой, выбор. */
  .fork { border-top: 1px solid var(--line); padding: 8px 0; }
  .fork:first-child { border-top: none; }
  .fork .fq { font-weight: 600; }
  .fork .fq .nid { font-family: ui-monospace, Menlo, monospace; color: var(--accent);
                   font-size: 13px; margin-right: 4px; }
  .fork .fq .lvl { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .fork ul { margin: 4px 0 6px 20px; padding: 0; }
  .fork .fdec { color: var(--done); font-size: 14px; }
  .fork .fdec.open { color: var(--warn); }
  .fork .prev { font-size: 12px; font-weight: 600; margin-left: 8px; padding: 1px 9px;
                border: 1px solid var(--accent); border-radius: 99px; text-decoration: none; }
  .fork .fmeta { font-size: 13px; color: var(--muted); margin: 3px 0; }
  .fork .fmeta.fixed { color: var(--ink); }
  .fork .fsub { font-size: 13px; color: var(--muted); margin-left: 2px; }
  /* ДОСКА ИСПОЛНЕНИЯ */
  .exnow { font-size: 17px; font-weight: 600; }
  .exmark { color: var(--accent); margin-right: 4px; }
  .exprog { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .exwait { color: var(--warn); margin-top: 6px; }
  .exrow { border-top: 1px solid var(--line); padding: 6px 0; }
  .exrow:first-of-type { border-top: none; }
  .exrow .nid { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-size: 13px; }
  .exrow .lvl { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .exrow .fsub { font-size: 13px; color: var(--muted); margin-left: 22px; }
  .crit { border-top: 1px solid var(--line); padding: 8px 0; display: flex;
          gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .crit:first-child { border-top: none; }
  .crit .v { font-size: 12px; font-weight: 600; padding: 1px 8px;
             border-radius: 99px; border: 1px solid var(--line); color: var(--muted);
             flex-shrink: 0; }
  .crit .v.met { color: var(--done); border-color: var(--done); }
  .crit .v.failed { color: var(--bad); border-color: var(--bad); }
  .crit .v.unverified { color: var(--warn); border-color: var(--warn); }
  .crit .proof { color: var(--muted); font-size: 13px; width: 100%; }
  .crit-node { font-weight: 600; margin: 10px 0 2px; }
  /* матрёшка проверки: пилюля-вердикт в строке узла и строка корня — сама задача */
  .vtree summary .v, .vroot .v { font-size: 12px; font-weight: 600; padding: 1px 8px;
    border-radius: 99px; border: 1px solid var(--line); color: var(--muted); flex: none; }
  .vtree summary .v.met, .vroot .v.met { color: var(--done); border-color: var(--done); }
  .vtree summary .v.failed, .vroot .v.failed { color: var(--bad); border-color: var(--bad); }
  .vtree summary .v.unverified, .vroot .v.unverified { color: var(--warn); border-color: var(--warn); }
  .vroot { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
           padding: 10px 2px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .vroot .vword { color: var(--muted); font-size: 13px; width: 100%; }
  .vroot .vword.none { color: var(--warn); }
  details.node { border: 1px solid var(--line); border-radius: 10px;
                 background: var(--card); margin: 8px 0; }
  details.node > summary { cursor: pointer; padding: 10px 14px; list-style: none;
                           display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  details.node > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
  details.node[open] > summary::before { content: "▾"; }
  details.node > summary .nid { font-family: ui-monospace, Menlo, monospace;
                                font-size: 13px; color: var(--accent); font-weight: 600; }
  details.node > summary .nname { font-weight: 600; }
  details.node > summary .lvl { font-size: 12px; color: var(--muted);
                                border: 1px solid var(--line); border-radius: 99px;
                                padding: 0 8px; }
  details.node > summary .done { color: var(--done); font-size: 13px; font-weight: 600; }
  details.node > .nbody { padding: 0 14px 12px; }
  /* УЗЕЛ РАСКРЫТ (владелец, 2026-08-24): суть одной строкой, контракт — своя складная карточка
     (свёрнута), дети — сразу под ней, а не за экраном текста. */
  .ngist { color: var(--muted); font-size: 14px; margin: 0 0 6px; overflow-wrap: anywhere; }
  details.node > .nbody > details.box { margin: 6px 0 8px; }
  details.node > .nbody > details.box > .body { padding-bottom: 10px; }
  .nkids { font-size: 12px; text-transform: uppercase; letter-spacing: .03em;
           color: var(--muted); margin: 10px 0 2px; }
  .nfield { margin: 8px 0 0; }
  /* КОНТРАКТ УЗЛА в две колонки (владелец, 2026-08-25: «всё перемешалось в кучу»): слева то,
     что читаешь — результат, критерии чек-листом с вердиктами, остановка плиткой; справа узко —
     условия. Порядок полей фиксирован, не как записал агент. */
  .ct { display: flex; gap: 20px; align-items: flex-start; }
  .ct .ctl { flex: 1.6 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .ct .ctr { flex: 1 1 0; min-width: 0; border-left: 1px solid var(--line); padding-left: 16px; }
  .ct .lab { margin-bottom: 4px; font-size: 12.5px; }
  .ct .lab .t { font-size: 12.5px; }
  .ct .res { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
  .ct .res .md { font-size: 16px; line-height: 1.45; }
  .ct .res .md p { margin-bottom: 4px; }
  .ct .chk { border-bottom: 1px solid var(--line); }
  .ct .ci { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line);
            font-size: 14.5px; }
  .ct .ci .m { flex: none; width: 18px; font-weight: 700; color: var(--muted); }
  .ct .ci .m.met { color: var(--done); } .ct .ci .m.failed { color: var(--bad); }
  .ct .ci .m.unverified { color: var(--warn); }
  .ct .ci .pf { font-size: 12.5px; color: var(--muted); }
  .ct .stop { border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; }
  .ct .stop .sg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px;
                  font-size: 13.5px; line-height: 1.45; }
  .ct .stop .sg .k { color: var(--muted); display: block; font-size: 12.5px; }
  .ct .sd { padding: 8px 0; border-top: 1px solid var(--line); }
  .ct .sd:first-child { border-top: none; padding-top: 0; }
  .ct .sd .md { font-size: 13.5px; line-height: 1.45; }
  .ct .sd .md p, .ct .sd .md ul { margin-bottom: 2px; }
  .ct .sd .md ul { margin-left: 16px; }
  .ct .other { font-size: 13.5px; }
  @media (max-width: 760px) {
    .ct { flex-direction: column; }
    .ct .ctr { border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 8px; }
    .ct .stop .sg { grid-template-columns: 1fr; }
  }
  .nfield b { display: block; font-size: 12.5px; text-transform: uppercase;
              letter-spacing: .03em; color: var(--muted); }
  .nfield > div { overflow-wrap: anywhere; margin-top: 2px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 6px 0;
          border-top: 1px solid var(--line); flex-wrap: wrap; }
  .file:first-child { border-top: none; }
  .file .size { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  audio { width: 100%; height: 36px; margin-top: 4px; }
  .entry { border-top: 1px solid var(--line); padding: 8px 0; }
  .entry:first-child { border-top: none; }
  .entry .top { display: flex; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .entry .type { color: var(--accent); font-weight: 600; }
  .entry .text { font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<div class="htop"><a class="back" href="../index.html">← все проекты</a><span class="hgen" id="hgen"></span></div>
<div class="hstatus" id="hstatus"></div>
<h1 id="name">Проект</h1>
<div class="hcard" id="hcard" hidden>
  <div class="hrow hident" id="hident"></div>
  <div class="hrow hfacts" id="hfacts"></div>
  <div class="hrow phases" id="phases"></div>
</div>
<div id="main"></div>
<div id="second"></div>

<script>
/* Страница — статичный читатель базы, её никто не переписывает. Данные для неё CLI
   складывает в ../metadata/<имя-папки-проекта>.js; страница вычисляет имя своей папки
   и подключает свой файл относительным путём — это разрешено даже с диска. */
window.ELEPHANT_OVERVIEW = null;
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var dir = decodeURIComponent(parts[parts.length - 2] || "");
  if (dir) document.write('<script src="../metadata/' +
    encodeURIComponent(dir) + '.js"><\/script>');
})();
</script>
<script>
(function () {
  var ORDER = ["context", "think", "plan", "execute", "validate", "reflect", "align", "close"];
  var RU = { context: "контекст", think: "думать", plan: "план", execute: "исполнение",
             validate: "проверка", reflect: "уроки", align: "сверка", close: "закрытие" };
  var DIMS = [["what", term("what", "что делаем")], ["why", term("why", "зачем")],
              ["who", term("who", "кто")], ["where", term("where", "где")],
              ["when", term("when", "когда")], ["how", term("how", "как")]];
  var VERDICT = { met: term("met", "сошёлся"), failed: term("failed", "не сошёлся"),
                  open: term("open", "не проверялся"), declined: term("declined", "снят"),
                  unverified: term("unverified", "не перепроверен") };
  /* СЛОВА (владелец, 2026-08-25): «складывается впечатление, что я использую неправильные слова
     и агент меня не сразу понимает» — термин печатается по-английски, как его зовут el и агент,
     рядом приглушённо русское пояснение. Читаешь по-русски, называешь словами CLI. */
  function term(en, ru) {
    return '<span class="t">' + esc(en) + "</span>" + (ru ? '<span class="g">' + esc(ru) + "</span>" : "");
  }
  function phT(p) { return term(p, RU[p] || ""); }
  /* ХОД РАБОТЫ по узлу (владелец, 2026-08-25): записи el log, сделанные, пока узел был в работе
     (у старых журналов — по времени, помечены ~), артефакты и доказательства. */
  var WL = (window.ELEPHANT_OVERVIEW || {}).worklog || {};
  function wlRows(list) {
    var out = "";
    list.forEach(function (e) {
      out += '<div class="entry"><div class="top"><span class="type">' + esc(e.type) + "</span><span>" +
             when(e.ts) + "</span>" + (e.by_time ? '<span title="запись без узла легла к узлу, который был в работе">~ по времени</span>' : "") +
             '</div><div class="text">' + esc(e.text) + "</div></div>";
    });
    return out;
  }
  var d = window.ELEPHANT_OVERVIEW;
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function when(iso) {
    if (!iso) return "";
    var t = new Date(iso);
    return isNaN(t) ? esc(iso) : t.toLocaleString("ru-RU",
      { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  /* A document arrives as {text, amend:[…]} — or as a plain string from a data file written
     before amendments existed; both render. */
  function doc(v) {
    if (v == null) return { text: "", amend: [] };
    if (typeof v === "string") return { text: v, amend: [] };
    return { text: v.text || "", amend: v.amend || [] };
  }
  function hasDoc(v) { var x = doc(v); return !!(x.text || x.amend.length); }
  /* MARKDOWN — a small, safe renderer of our own (no libraries, works from disk): headings,
     bullet and numbered lists, **bold**, _italic_, `code`, ~~struck~~, > quotes, links,
     rules; a single newline is a line break (the documents are line-oriented). The text
     is HTML-escaped FIRST, then shaped. A literal "\n" left by an agent's shell is a break. */
  function inlineMd(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/~~([^~]+)~~/g, "<s>$1</s>")
      .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s.,;:!?)]|$)/g, "$1<i>$2</i>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s.,;:!?)]|$)/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
        return '<a href="' + u + '" target="_blank">' + t + "</a>";
      });
  }
  function inl(t) { return inlineMd(esc(t).replace(/\\n/g, "<br>")); }
  /* a proof that names its file — «… [evidence/x.png]» — gets the file as a link */
  function proofHtml(p) {
    var m = /^(.*)\s\[([^\]]+)\]\s*$/.exec(p || "");
    if (!m) return inl(p);
    return inl(m[1]) + ' <a href="' + encodeURI(m[2]) + '" target="_blank">' + esc(m[2]) + " ↗</a>";
  }
  function md(text) {
    var lines = esc(text).replace(/\\n/g, "\n").split("\n");
    var out = "", inList = null, inQuote = false, para = [];
    function flushPara() { if (para.length) { out += "<p>" + para.join("<br>") + "</p>"; para = []; } }
    function closeList() { if (inList) { out += "</" + inList + ">"; inList = null; } }
    function closeQuote() { if (inQuote) { out += "</blockquote>"; inQuote = false; } }
    lines.forEach(function (raw) {
      var l = raw.replace(/\s+$/, ""), m;
      if (!l.trim()) { flushPara(); closeList(); closeQuote(); return; }
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) {
        flushPara(); closeList(); closeQuote();
        out += '<div class="mh mh' + m[1].length + '">' + inlineMd(m[2]) + "</div>"; return;
      }
      if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flushPara(); closeList(); closeQuote(); out += "<hr>"; return; }
      if ((m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/))) {
        flushPara(); closeQuote();
        var tag = /^\s*\d/.test(l) ? "ol" : "ul";
        if (inList !== tag) { closeList(); out += "<" + tag + ">"; inList = tag; }
        out += "<li>" + inlineMd(m[1]) + "</li>"; return;
      }
      if ((m = l.match(/^&gt;\s?(.*)$/))) {
        flushPara(); closeList();
        if (!inQuote) { out += "<blockquote>"; inQuote = true; }
        out += inlineMd(m[1]) + "<br>"; return;
      }
      if (inList && /^\s{2,}\S/.test(raw)) {       /* indented line continues the item */
        out = out.replace(/<\/li>$/, "<br>" + inlineMd(l.trim()) + "</li>"); return;
      }
      closeList(); closeQuote(); para.push(inlineMd(l));
    });
    flushPara(); closeList(); closeQuote();
    return '<div class="md">' + out + "</div>";
  }
  function textHtml(t) { return md(t); }
  function amendHtml(items) {
    var out = "";
    (items || []).forEach(function (a) {
      out += '<div class="amend"><div class="amend-h">⟲ поправка п' + esc(a.n) + " · " +
             esc(a.ts) + " · " + phT(a.phase) + "</div>" +
             (a.why ? '<div class="amend-why">почему: ' + esc(a.why) + "</div>" : "") +
             (a.refs && a.refs !== "—" ? '<div class="amend-why">основание: ' + esc(a.refs) + "</div>" : "") +
             md(a.text) + "</div>";
    });
    return out;
  }
  function docHtml(v) {
    var x = doc(v);
    return md(x.text) + amendHtml(x.amend);
  }
  function kb(n) {
    if (n == null) return "";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }
  if (!d) {
    document.getElementById("main").innerHTML =
      '<div class="empty">Данные не найдены: страница ждёт свой файл в ../metadata/. ' +
      "Он появляется после первой команды el в проекте.</div>";
    return;
  }
  document.title = d.name || d.dir || "Проект";
  document.getElementById("name").textContent = d.name || d.dir || "Проект";

  /* ШАПКА — ПАСПОРТ ПРОЕКТА (владелец, 2026-08-25: «дату создания, дату обновления, информацию
     о проекте, что можно было скопировать»). Дата рождения — штамп `created` из журнала
     (created_at; у старых файлов данных — первая запись журнала). Папка — из данных (path),
     а со старого файла данных — из адреса самой страницы. */
  var cur = ORDER.indexOf(d.phase);
  var closed = !!(d.outcome || (d.status && d.status !== "active"));
  var MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var WD = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
  var OUT = { completed: ["completed", "доехали", "done"], closed: ["closed", "закрыто", "closed"],
              dropped: ["dropped", "отброшено", "closed"], blocked: ["blocked", "заблокировано", "bad"] };
  var MODE = { light: ["лёгкий", "мало обязательного"], soft: ["мягкий", "костяк обязателен"],
               strict: ["строгий", "каждый такт обязателен"] };
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function full(iso) {
    var t = new Date(iso);
    if (!iso || isNaN(t)) return esc(iso || "");
    return t.getDate() + " " + MON[t.getMonth()] + " " + t.getFullYear() + " · " +
           pad(t.getHours()) + ":" + pad(t.getMinutes());
  }
  function isoShort(iso) {
    var t = new Date(iso);
    return (!iso || isNaN(t)) ? String(iso || "") : t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" +
           pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    return n + " " + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many);
  }
  /* a span of time in two units at most: «13 ч 29 мин» · «4 дня 9 ч» · «2 месяца 3 дня» */
  function dur(ms) {
    var m = Math.floor(Math.max(0, ms) / 60000), h = Math.floor(m / 60), dd = Math.floor(h / 24);
    if (m < 1) return "меньше минуты";
    if (h < 1) return plural(m, "минута", "минуты", "минут");
    if (dd < 1) return plural(h, "час", "часа", "часов") + (m % 60 ? " " + (m % 60) + " мин" : "");
    if (dd < 30) return plural(dd, "день", "дня", "дней") + (h % 24 ? " " + (h % 24) + " ч" : "");
    var mo = Math.floor(dd / 30);
    return plural(mo, "месяц", "месяца", "месяцев") + (dd % 30 ? " " + plural(dd % 30, "день", "дня", "дней") : "");
  }
  /* how long ago, one unit: «только что» · «3 часа назад» · «вчера» · «4 дня назад» */
  function ago(iso) {
    var t = new Date(iso);
    if (!iso || isNaN(t)) return "";
    var m = Math.floor((Date.now() - t) / 60000), h = Math.floor(m / 60), dd = Math.floor(h / 24);
    if (m < 1) return "только что";
    if (h < 1) return plural(m, "минуту", "минуты", "минут") + " назад";
    if (dd < 1) return plural(h, "час", "часа", "часов") + " назад";
    if (dd === 1) return "вчера";
    if (dd < 30) return plural(dd, "день", "дня", "дней") + " назад";
    return plural(Math.floor(dd / 30), "месяц", "месяца", "месяцев") + " назад";
  }
  var createdIso = d.created_at ||
    (((d.journal || []).filter(function (e) { return e.type === "created"; })[0] || {}).ts || "");
  var absPath = d.path || (location.protocol === "file:" ?
    decodeURIComponent(location.pathname).replace(/\/[^\/]*$/, "") : "");
  var rootPath = d.root || (absPath ? absPath.replace(/\/[^\/]*$/, "") : "");
  var storeName = d.store || (rootPath ? rootPath.split("/").pop() : "");
  function homeish(p) { return p.replace(/^\/(Users|home)\/[^\/]+\//, "~/"); }

  /* top right — which storage, and when this page's data was gathered (same words as index) */
  document.getElementById("hgen").innerHTML =
    (storeName ? "хранилище <code>" + esc(storeName) + "</code> · " : "") +
    (d.generated ? "страница собрана " + when(d.generated) : "");

  /* status in a word: в работе · доехали · закрыто · отброшено · заблокировано */
  var hOut = OUT[d.outcome] || [d.outcome || d.status || "", "", "closed"];
  document.getElementById("hstatus").innerHTML = closed
    ? '<span class="hpill ' + hOut[2] + '">' + term((hOut[0] === "completed" ? "✓ " : "") + hOut[0], hOut[1]) +
      "</span><span>закрыт" + (d.closed_at ? " " + full(d.closed_at) : "") +
      (cur >= 0 ? " · phase " + (cur + 1) + " · " + phT(d.phase) : "") + "</span>"
    : '<span class="hpill">' + term("active", "в работе") + "</span><span>" +
      (cur >= 0 ? "phase " + (cur + 1) + "/8 · " + phT(d.phase) : "") +
      (d.in_hand ? " · в руке у агента" + (d.held_at ? " с " + when(d.held_at) : "") : "") + "</span>";

  /* where it lives — and the copy buttons */
  var ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
             'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
             '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>' +
             '<path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"></path></svg>';
  var ident = document.getElementById("hident");
  ident.innerHTML =
    '<span class="hwhere">' +
    (absPath ? '<code class="hpath" title="' + esc(absPath) + '">' + esc(homeish(rootPath) + "/") + "</code>" : "") +
    '<code class="hid">' + esc(d.dir || "") + "</code></span>" +
    '<div class="hbtns"><button class="cbtn" data-copy="id" title="имя папки проекта">' + ICON + "<span>id</span></button>" +
    (absPath ? '<button class="cbtn" data-copy="path" title="полный путь к папке проекта">' + ICON + "<span>путь</span></button>" : "") +
    '<button class="cbtn" data-copy="card" title="название · папка · статус · даты · как продолжить — вставь агенту">' +
    ICON + "<span>карточка для агента</span></button></div>";

  /* the facts: created · updated (· closed · took) · mode · plan nodes */
  function fact(k, v, s, cls) {
    return '<div class="fact"><div class="k">' + k + '</div><div class="v' + (cls ? " " + cls : "") + '">' +
           v + "</div>" + (s ? '<div class="s">' + s + "</div>" : "") + "</div>";
  }
  var hBorn = new Date(createdIso), hClosedAt = new Date(d.closed_at || "");
  var hNodes = d.nodes || [0, 0], hVal = d.val || [0, 0];
  var hf = fact("создан", createdIso ? full(createdIso) : "—",
               createdIso && !isNaN(hBorn) ? WD[hBorn.getDay()] + " · " + ago(createdIso) : "");
  if (closed) {
    hf += fact("закрыт", d.closed_at ? full(d.closed_at) : "—", esc(d.outcome || ""), hOut[2]);
    if (!isNaN(hBorn) && !isNaN(hClosedAt)) hf += fact("заняло", dur(hClosedAt - hBorn), "от создания до закрытия");
    hf += fact("обновлён", d.updated_at ? full(d.updated_at) : "—",
              d.updated_at ? "последний след · " + ago(d.updated_at) : "");
  } else {
    hf += fact("обновлён", d.updated_at ? full(d.updated_at) : "—", ago(d.updated_at));
    if (!isNaN(hBorn)) hf += fact("в работе", dur(Date.now() - hBorn), "от создания до сейчас");
    if (MODE[d.mode]) hf += fact("mode · режим", esc(d.mode), MODE[d.mode][0] + " — " + MODE[d.mode][1]);
  }
  hf += fact("nodes · узлы плана", hNodes[1] ? hNodes[0] + " / " + hNodes[1] : "—",
            hNodes[1] ? (hVal[1] ? "criteria met · сошлись " + hVal[0] + " / " + hVal[1] : "") : "плана пока нет");
  document.getElementById("hfacts").innerHTML = hf;
  document.getElementById("hcard").hidden = false;

  /* КАРТОЧКА ДЛЯ АГЕНТА — то, что человек вставляет в новую сессию: что за проект, где лежит,
     в каком состоянии и одна команда, чтобы взять его в руку (или прочитать закрытый). */
  function cardText() {
    var lines = ["Project: " + (d.name || d.dir || "")];
    if (absPath) lines.push("Folder: " + absPath);
    lines.push("Status: " + (closed ? hOut[0] + (hOut[1] ? " (" + hOut[1] + ")" : "") +
                                      (d.closed_at ? " · closed " + isoShort(d.closed_at) : "")
                                    : "active (в работе)") +
               (cur >= 0 ? " · phase " + (cur + 1) + " " + d.phase + " (" + RU[d.phase] + ")" : "") +
               (MODE[d.mode] ? " · mode " + d.mode : ""));
    lines.push("Created: " + (createdIso ? isoShort(createdIso) : "—") +
               " · updated: " + (d.updated_at ? isoShort(d.updated_at) : "—"));
    if (hNodes[1]) lines.push("Nodes: " + hNodes[0] + "/" + hNodes[1] +
                             (hVal[1] ? " · criteria met: " + hVal[0] + "/" + hVal[1] : ""));
    if (rootPath && d.dir) lines.push((closed ? "Read: " : "Continue: ") + 'cd "' + rootPath +
                                      '" && el ' + (closed ? "context --task " : "use ") + d.dir);
    return lines.join("\n");
  }
  function copyLegacy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();

    document.body.removeChild(ta);

  }
  function copyText(text) {

  var strip = document.getElementById("phases");
  ORDER.forEach(function (ph, i) {

  /* АВТОНОМИЯ в полосе: выдана · остановлена · долг слова — то же, что печатает el status. */
  var au = d.autonomy || null;
  var nDebt = au ? (au.debt || 0) : 0;
  /* ЗА ТОБОЙ (владелец, 2026-08-24): долг владельца — из того же леджера, что печатает el status
     (owe.ledger), плюс открытые развилки, где решает он: это тот же долг вида «решить». */
  var ow = d.owed || null;

  var owOpen = owItems.filter(function (x) { return x.status === "open"; });

  /* ЭСТАФЕТА (2026-08-25): узел «ждёт владельца» — сценарий в его руках; это тот же долг

  var baton = ((d.exec || {}).nodes || []).filter(function (n) { return n.status === "waiting"; });
  var nOwe = owOpen.length + ownerForks.length + baton.length;
  var nStand = owOpen.filter(function (x) { return x.stands && x.stands.length; }).length +

  if (au && au.grant) {

  var amList = d.amend_list || [];

  /* ПАМЯТЬ СЕКЦИЙ — что свёрнуто, что раскрыто, помнит браузер для ЭТОГО проекта и после
     перезагрузки (владелец, 2026-08-22: «если я секцию свернул — она не показывалась, и после
     перезагрузки всё так и осталось»). Пока человек не трогал секцию — дефолт: главное
     раскрыто, второстепенное свёрнуто. localStorage может быть недоступен — тогда просто дефолты. */
  var MEM_KEY = "el.overview." + (d.dir || location.pathname);
  var mem = {};
  try { mem = JSON.parse(localStorage.getItem(MEM_KEY) || "{}") || {}; } catch (e) { mem = {}; }
  function isOpen(key, dflt) { return (key in mem) ? !!mem[key] : !!dflt; }
  function box(key, title, inner, dflt, extraCls) {
    return '<details class="box' + (extraCls ? " " + extraCls : "") + '" data-key="' + esc(key) +
           '"' + (isOpen(key, dflt) ? " open" : "") + "><summary>" + title + "</summary>" +
           '<div class="body">' + inner + "</div></details>";
  }
  /* a SECTION: the uppercase heading is itself the handle; default open unless told otherwise */
  function sec(key, title, inner, dflt) {
    if (dflt === undefined) dflt = true;

           "><summary>" + title + "</summary>" + inner + "</details>";
  }

  /* ЗАГОЛОВОК — итог и запрос, вне лент: ответ и исходная точка читаются первыми. */
  var h = "";
  /* ОСТАНОВКА — первой: открыв страницу, человек сразу видит, где агент встал и что от него
     нужно. Задача при этом открыта — это не «done». */
  if (au && au.halt) {
    h += sec("halt", term("halt", "автономия остановлена здесь"),
             '<div class="halt"><div class="hh">⛔ кредит слова дальше не распространяется</div>' +
             '<div class="txt">' + inl(au.halt.text || "") + "</div>" +
             '<div class="hmeta">' + when(au.halt.ts) +
             (au.halt.phase ? " · phase: " + phT(au.halt.phase) : "") +
             " · долг слова: " + nDebt +
             " · задача открыта и ждёт слова человека — его слово над той же областью платит займ, " +
             "его «продолжай» открывает автономию дальше</div></div>");
  }
  /* ЗА ТОБОЙ — ВЫЯСНИТЬ И РЕШИТЬ (владелец, 2026-08-24): вопрос задан, а ответа нет и у него —
     он пошёл выяснять (кто подписывает, кто третий) или думать (какой вариант). Не тормоз сам
     по себе: работа идёт; держит только то, к чему привязан, — и там работа СТОИТ. Стоит второй
     после остановки: открыв страницу, человек видит, что от него нужно. Раскрыта, пока есть
     открытое; оплаченное и снятое — ниже, приглушённо. */
  if (owItems.length || ownerForks.length || baton.length) {
    var orows = "";
    owOpen.forEach(function (it) {
      var st = (it.stands && it.stands.length) ? ["stand", "стоим"] :
               (it.holds && it.holds.length) ? ["held", "держит"] : ["free", "пока не держит"];
      var holds = "";
      (it.holds || []).forEach(function (hd, i) {
        var key = hd.indexOf("node:") === 0 ? "plan.tree" : hd.indexOf("fork:") === 0 ? "think.decision" : "";
        holds += (i ? " · " : "") + esc((it.holds_labels || [])[i] || hd) +
                 (key ? ' <a class="jump" href="#" data-jump="' + key + '">→</a>' : "");

      orows += '<div class="owe-row"><span class="v ' + st[0] + '">' + st[1] + "</span>" +
               '<span class="kind">' + esc(it.kind) + "</span>#" + esc(it.n) + " · " + inl(it.q) +
               '<div class="fsub"><b>как:</b> ' + inl(it.how || "—") + " · ждёт с " + when(it.ts) +
               (it.by ? " · <b>срок:</b> " + esc(it.by) +
                        (it.overdue ? ' <span class="over">просрочен</span>' : "") : "") +
               (it.area ? " · область: " + esc(it.area) : "") + "</div>" +
               (holds ? '<div class="fsub"><b>держит:</b> ' + holds + "</div>" : "") + "</div>";
    });
    ownerForks.forEach(function (f) {

               "возвращает эстафету" +

      lr += '<div class="loan-row"><span class="v ' + (a.paid ? "paid" : "debt") + '">' +
            (a.paid ? term("paid", "оплачен") : term("debt", "долг")) + "</span>" +

             '<div class="plain">' + lr + "</div>", !!(nDebt || au.halt));

  /* ПОПРАВКИ ОДНИМ СПИСКОМ — стоят здесь, над лентами; собираются ниже, когда известны
     подписи документов (FRAME · IFRP · лестница думания), и вставляются на это место. */
  /* НА ПОТОМ (2026-08-25): обещания агента, отложенные до названной фазы, и напоминания ⟳ —
     человеку видно, что не забыто, без шума: заголовок со счётчиком, список свёрнут. */
  var todos = d.todos || [];
  var tOpen = todos.filter(function (t) { return t.open; });
  var tDone = todos.filter(function (t) { return !t.open; });
  if (todos.length) {
    var trows = "";
    tOpen.forEach(function (t) {
      trows += '<div class="owe-row"><span class="v ' + (t.every ? "free" : "held") + '">' +
               (t.every ? "⟳ " + esc(t.every) : "к фазе: " + (RU[t.phase] ? phT(t.phase) : esc(t.phase || "любой"))) +
               "</span>" + inl(t.text) +

  /* ЛЕНТЫ ЭТАПОВ — каждая секция стоит под полосой своего этапа, и полоса ЛИПКАЯ: пока

     вижу, к какому этапу относится»). Пройденный этап — зелёный, текущий — выделен,
     впереди — приглушённый; пустой этап всё равно показан одной строкой — это карта.

  var TITLE = { context: "что у нас есть", think: "что с этим делать и какие варианты",
                plan: "в каком порядке и что от чего зависит", execute: "делаем",
                validate: "работает ли на живом", reflect: "работа над ошибками и уроки",

  var files = d.files || {};
  function filesBox(folder, label) {

  function band(ph, inner) {
